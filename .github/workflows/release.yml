name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.2.0)
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and test
        run: |
          dotnet build WorkToUnlock.sln -c Release
          dotnet test tests/WorkToUnlock.Core.Tests -c Release --no-build
          dotnet test tests/WorkToUnlock.Agent.Tests -c Release --no-build
          dotnet test tests/WorkToUnlock.IntegrationTests -c Release --no-build
      - name: Publish and build installer
        shell: pwsh
        run: ./build/Publish.ps1 -Version ${{ steps.version.outputs.value }}
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/installer/*.msi, artifacts/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: work-to-unlock-${{ steps.version.outputs.value }}
          path: |
            artifacts/installer/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
      - name: GitHub release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/installer/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
